<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="3" fill="#18181b"/>
  <!-- 8-Bit Pixel 'S' -->
  <rect x="5" y="3" width="6" height="2" fill="#ffd23f"/>
  <rect x="4" y="4" width="2" height="4" fill="#ffd23f"/>
  <rect x="5" y="7" width="6" height="2" fill="#ffd23f"/>
  <rect x="10" y="8" width="2" height="4" fill="#ffd23f"/>
  <rect x="5" y="11" width="6" height="2" fill="#ffd23f"/>
  <!-- Pixel accents -->
  <rect x="5" y="3" width="6" height="1" fill="#fffbeb"/>
  <rect x="5" y="7" width="6" height="1" fill="#f59e0b"/>
  <rect x="5" y="12" width="6" height="1" fill="#d97706"/>
</svg>
